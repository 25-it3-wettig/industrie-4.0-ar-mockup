<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 AR Mockup – Schwein</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Kamera-/Canvas-Darstellung */
    video,
    canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }

    /* Ebene über der AR-Kamera */
    #pig-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }

    #pig {
      display: none;
      position: absolute;
      top: 52%;
      left: 0;
      width: 150px;
      height: 105px;
      transform: translate(-180px, -50%);
      will-change: transform;
    }

    #pig.is-running {
      display: block;
      animation: pig-run 5s linear forwards;
    }

    #pig-emoji {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 96px;
      line-height: 1;
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.45));
      animation: pig-bounce 0.28s ease-in-out infinite alternate;
    }

    /* Zahl auf dem Rücken */
    #pig-number {
      position: absolute;
      top: 8px;
      left: 52%;
      z-index: 1;
      min-width: 31px;
      height: 31px;
      padding: 0 5px;
      box-sizing: border-box;
      border: 3px solid white;
      border-radius: 50%;
      background: #e60023;
      color: white;
      font-size: 18px;
      font-weight: bold;
      line-height: 25px;
      text-align: center;
      text-shadow: 0 1px 2px black;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      transform: translateX(-50%);
    }

    @keyframes pig-run {
      from {
        transform: translate(-180px, -50%);
      }

      to {
        transform: translate(calc(100vw + 30px), -50%);
      }
    }

    @keyframes pig-bounce {
      from {
        translate: 0 0;
        rotate: -2deg;
      }

      to {
        translate: 0 -9px;
        rotate: 2deg;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #pig.is-running {
        animation-duration: 8s;
      }

      #pig-emoji {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    embedded
    arjs="sourceType: webcam;
          facingMode: environment;
          sourceWidth: 1280;
          sourceHeight: 720;
          displayWidth: 1280;
          displayHeight: 720;
          debugUIEnabled: false;">

    <a-marker preset="hiro" id="hiro-marker"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="pig-layer" aria-hidden="true">
    <div id="pig">
      <div id="pig-emoji">🐖</div>
      <span id="pig-number">1</span>
    </div>
  </div>

  <script>
    const hiroMarker = document.getElementById("hiro-marker");
    const pig = document.getElementById("pig");
    const pigNumber = document.getElementById("pig-number");

    let markerFoundCount = 0;

    function runPig() {
      markerFoundCount += 1;
      pigNumber.textContent = markerFoundCount;

      // Animation bei jeder neuen Erkennung erneut starten
      pig.classList.remove("is-running");
      void pig.offsetWidth;
      pig.classList.add("is-running");
    }

    function stopPig() {
      pig.classList.remove("is-running");
    }

    hiroMarker.addEventListener("markerFound", () => {
      console.debug("Marker found");
      runPig();
    });

    hiroMarker.addEventListener("markerLost", () => {
      console.debug("Marker lost");
      stopPig();
    });

    pig.addEventListener("animationend", stopPig);

    /*
     * Testfunktionen für die Browser-Konsole:
     *
     * fireEventMarkerFound()
     * fireEventMarkerLost()
     */
    window.fireEventMarkerFound = () => {
      hiroMarker.dispatchEvent(new CustomEvent("markerFound"));
    };

    window.fireEventMarkerLost = () => {
      hiroMarker.dispatchEvent(new CustomEvent("markerLost"));
    };
  </script>
</body>
</html>
