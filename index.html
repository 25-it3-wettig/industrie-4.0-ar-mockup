<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrie 4.0 AR Mockup</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #overlay {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,0.85);
      color: #00ffff;
      border: 2px solid #00ffff;
      font-weight: bold;
    }

    video,
    canvas {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }
  </style>
</head>
<body>

<div id="overlay">
  INDUSTRIE 4.0 SYSTEM ONLINE
</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true"
  embedded
  arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

  <a-marker preset="hiro" id="hiro-marker">

    <!-- Dashboard -->

    <a-plane
      position="0 1 0"
      width="3"
      height="2"
      color="#001122"
      opacity="0.95">
    </a-plane>

    <!-- Titel -->

    <a-text
      value="MASCHINE CNC-01"
      position="-1.3 1.7 0.01"
      color="#00FFFF"
      scale="0.8 0.8 0.8">
    </a-text>

    <!-- Daten -->

    <a-text
      value="STATUS: ONLINE"
      position="-1.3 1.3 0.01"
      color="#00FF00">
    </a-text>

    <a-text
      value="TEMP: 68 C"
      position="-1.3 1.0 0.01"
      color="#FFFFFF">
    </a-text>

    <a-text
      value="DREHZAHL: 3200 RPM"
      position="-1.3 0.7 0.01"
      color="#FFFFFF">
    </a-text>

    <a-text
      value="LEISTUNG: 11.4 KW"
      position="-1.3 0.4 0.01"
      color="#FFFF00">
    </a-text>

    <a-text
      value="STROM: 22 A"
      position="-1.3 0.1 0.01"
      color="#FFFFFF">
    </a-text>

    <a-text
      value="VIBRATION: NORMAL"
      position="-1.3 -0.2 0.01"
      color="#00FF00">
    </a-text>

    <!-- Hologramm Ring -->

    <a-ring
      radius-inner="0.45"
      radius-outer="0.60"
      position="1 0.8 0"
      rotation="90 0 0"
      color="#00FFFF"
      animation="
         property: rotation;
         to: 90 360 0;
         loop: true;
         dur: 2500">
    </a-ring>

    <!-- LED -->

    <a-sphere
      position="1 0.8 0.1"
      radius="0.10"
      color="#00FF00"
      animation="
         property: scale;
         from: 1 1 1;
         to: 1.7 1.7 1.7;
         dir: alternate;
         loop: true;
         dur: 800">
    </a-sphere>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
const overlay = document.getElementById('overlay');
const marker = document.getElementById('hiro-marker');

marker.addEventListener('markerFound', () => {
  overlay.style.display = 'block';
});

marker.addEventListener('markerLost', () => {
  overlay.style.display = 'none';
});
</script>

</body>
</html>
