<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Industrie 4.0 AR</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}

#overlay {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    background: black;
    border: 2px solid cyan;
    color: cyan;
    padding: 10px;
    z-index: 1000;
}
</style>
</head>

<body>

<div id="overlay">MASCHINE ERKANNT</div>

<a-scene
embedded
vr-mode-ui="enabled: false"
arjs="sourceType: webcam; debugUIEnabled: false;">

<a-marker preset="hiro" id="hiro-marker">

    <!-- Hintergrund -->

    <a-plane
        position="0 1 0"
        width="4"
        height="2.5"
        color="black"
        opacity="0.9">
    </a-plane>

    <!-- Überschrift -->

    <a-text
        value="INDUSTRIE 4.0"
        position="-1.8 1.8 0.1"
        color="#00FFFF"
        width="8">
    </a-text>

    <!-- Werte -->

    <a-text
        value="STATUS: ONLINE"
        position="-1.8 1.3 0.1"
        color="#00FF00"
        width="8">
    </a-text>

    <a-text
        value="TEMPERATUR: 68 C"
        position="-1.8 0.9 0.1"
        color="#FF0000"
        width="8">
    </a-text>

    <a-text
        value="DREHZAHL: 3200 RPM"
        position="-1.8 0.5 0.1"
        color="#00FFFF"
        width="8">
    </a-text>

    <a-text
        value="LEISTUNG: 11.4 KW"
        position="-1.8 0.1 0.1"
        color="#FFFF00"
        width="8">
    </a-text>

    <a-text
        value="STROM: 22 A"
        position="-1.8 -0.3 0.1"
        color="#FFFFFF"
        width="8">
    </a-text>

    <a-text
        value="HYDRAULIK: 142 BAR"
        position="-1.8 -0.7 0.1"
        color="#FF00FF"
        width="8">
    </a-text>

    <!-- Ring -->

    <a-ring
        radius-inner="0.4"
        radius-outer="0.6"
        position="1.3 0.5 0"
        rotation="90 0 0"
        color="#00FFFF"
        animation="
        property: rotation;
        to: 90 360 0;
        loop: true;
        dur: 2000">
    </a-ring>

    <!-- LED -->

    <a-sphere
        position="1.3 0.5 0.2"
        radius="0.1"
        color="#00FF00"
        animation="
        property: scale;
        from: 1 1 1;
        to: 2 2 2;
        dir: alternate;
        loop: true;
        dur: 800">
    </a-sphere>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

<script>
const marker = document.getElementById('hiro-marker');
const overlay = document.getElementById('overlay');

marker.addEventListener('markerFound', () => {
    overlay.style.display = 'block';
});

marker.addEventListener('markerLost', () => {
    overlay.style.display = 'none';
});
</script>

</body>
</html>
