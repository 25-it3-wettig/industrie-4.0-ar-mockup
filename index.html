<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFERD TOOLS AR Demo</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#overlay {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    padding: 12px;
    border-radius: 10px;
    background: rgba(0,0,0,0.9);
    color: #00ffff;
    border: 2px solid #00ffff;
    font-size: 20px;
    font-weight: bold;
}
</style>

</head>
<body>

<div id="overlay">
    PFERD TOOLS ERKANNT
</div>

<a-scene
embedded
vr-mode-ui="enabled: false"
renderer="antialias: true;"
arjs="sourceType: webcam; debugUIEnabled: false;">

<a-marker preset="hiro" id="hiro-marker">

    <!-- Dashboard senkrecht -->

    <a-plane
        position="0 2 0"
        rotation="0 0 0"
        width="6"
        height="4"
        color="#000814"
        opacity="0.95">
    </a-plane>

    <!-- Titel -->

    <a-text
        value="PFERD TOOLS"
        position="-2.4 3.5 0.1"
        color="#00FFFF"
        scale="2.2 2.2 2.2">
    </a-text>

    <!-- Daten -->

    <a-text
        value="GEGRUENDET: 1799"
        position="-2.4 2.6 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="STANDORT: MARIENHEIDE"
        position="-2.4 2.1 0.1"
        color="#FFFF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="MITARBEITER: 2100"
        position="-2.4 1.6 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="UMSATZ: 370 MIO EUR"
        position="-2.4 1.1 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="METALLBEARBEITUNG"
        position="-2.4 0.4 0.1"
        color="#00FF00"
        scale="1.4 1.4 1.4">
    </a-text>

    <a-text
        value="SCHLEIFEN | TRENNEN"
        position="-2.4 -0.1 0.1"
        color="#00FF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="FRAESEN | ENTGRATEN"
        position="-2.4 -0.6 0.1"
        color="#00FF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <!-- GROSSER HOLOGRAMM RING -->

    <a-torus
        position="2.2 1.8 0.2"
        radius="1.2"
        radius-tubular="0.18"
        color="#00FFFF"
        animation="
        property: rotation;
        to: 0 360 0;
        loop: true;
        dur: 2000">
    </a-torus>

    <!-- ZWEITER RING -->

    <a-ring
        radius-inner="1.3"
        radius-outer="1.45"
        position="2.2 1.8 0.15"
        rotation="0 0 0"
        color="#00FF00"
        animation="
        property: rotation;
        to: 360 360 0;
        loop: true;
        dur: 3000">
    </a-ring>

    <!-- STATUS LED -->

    <a-sphere
        position="2.2 1.8 0.4"
        radius="0.25"
        color="#00FF00"
        animation="
        property: scale;
        from: 1 1 1;
        to: 2 2 2;
        dir: alternate;
        loop: true;
        dur: 800">
    </a-sphere>

    <!-- ONLINE TEXT -->

    <a-text
        value="SYSTEM ONLINE"
        position="1.1 3.2 0.2"
        color="#00FF00"
        scale="1.4 1.4 1.4">
    </a-text>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

<script>
const marker = document.getElementById('hiro-marker');
const overlay = document.getElementById('overlay');

marker.addEventListener('markerFound', () => {
    overlay.style.display = 'block';
});

marker.addEventListener('markerLost', () => {
    overlay.style.display = 'none';
});
</script>

</body>
</html>
