<a-marker preset="hiro" id="hiro-marker">

    <!-- Dashboard -->

    <a-plane
        position="0 2 0"
        width="6"
        height="4"
        color="#000814"
        opacity="0.95">
    </a-plane>

    <a-text
        value="MASCHINE CNC-01"
        position="-2.5 3.4 0.1"
        color="#00FFFF"
        scale="2 2 2">
    </a-text>

    <a-text
        value="STATUS: ONLINE"
        position="-2.5 2.7 0.1"
        color="#00FF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="TEMPERATUR: 68 C"
        position="-2.5 2.2 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="DREHZAHL: 3200 RPM"
        position="-2.5 1.7 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="LEISTUNG: 11.4 KW"
        position="-2.5 1.2 0.1"
        color="#FFFF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="STROM: 22 A"
        position="-2.5 0.7 0.1"
        color="#FFFFFF"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="VIBRATION: NORMAL"
        position="-2.5 0.2 0.1"
        color="#00FF00"
        scale="1.2 1.2 1.2">
    </a-text>

    <a-text
        value="WARTUNG IN 12 TAGEN"
        position="-2.5 -0.3 0.1"
        color="#FFA500"
        scale="1.2 1.2 1.2">
    </a-text>

    <!-- Großer Hologramm Ring -->

    <a-torus
        position="2.2 1.8 0.2"
        radius="1.2"
        radius-tubular="0.18"
        color="#00FFFF"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
    </a-torus>

    <!-- Zweiter Ring -->

    <a-ring
        radius-inner="1.3"
        radius-outer="1.45"
        position="2.2 1.8 0.15"
        color="#00FF00"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 3000">
    </a-ring>

    <!-- Status LED -->

    <a-sphere
        position="2.2 1.8 0.4"
        radius="0.25"
        color="#00FF00"
        animation="property: scale; from: 1 1 1; to: 2 2 2; dir: alternate; loop: true; dur: 800">
    </a-sphere>

    <a-text
        value="INDUSTRIE 4.0"
        position="1.0 3.1 0.1"
        color="#00FFFF"
        scale="1.2 1.2 1.2">
    </a-text>

</a-marker>
