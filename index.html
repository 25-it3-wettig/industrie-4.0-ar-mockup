<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industrie 4.0 AR Dashboard</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#overlay{
    display:none;
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;
    padding:12px;
    border-radius:10px;
    background:rgba(0,0,0,0.9);
    color:#00FFFF;
    border:2px solid #00FFFF;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<div id="overlay">
MASCHINE AKTIV
</div>

<a-scene
vr-mode-ui="enabled: false"
renderer="logarithmicDepthBuffer: true"
embedded
arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

<a-marker preset="hiro" id="hiro-marker">

    <!-- Dashboard -->

    <a-plane
        position="0 1 0"
        width="3.2"
        height="2.2"
        color="#000814"
        opacity="0.95">
    </a-plane>

    <!-- Titel -->

    <a-text
        value="CNC FRAESMASCHINE M-01"
        position="-1.45 1.75 0.01"
        color="#00FFFF"
        scale="0.8 0.8 0.8">
    </a-text>

    <!-- Maschinenwerte -->

    <a-text
        value="STATUS: ONLINE"
        position="-1.45 1.35 0.01"
        color="#00FF00"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="TEMP MOTOR: 68 C"
        position="-1.45 1.05 0.01"
        color="#FF3300"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="DREHZAHL: 3200 RPM"
        position="-1.45 0.75 0.01"
        color="#00FFFF"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="LEISTUNG: 11.4 KW"
        position="-1.45 0.45 0.01"
        color="#FFFF00"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="STROM: 22 A"
        position="-1.45 0.15 0.01"
        color="#FFFFFF"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="HYDRAULIK: 142 BAR"
        position="-1.45 -0.15 0.01"
        color="#FF00FF"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="VIBRATION: 0.32 G"
        position="-1.45 -0.45 0.01"
        color="#00FF00"
        scale="0.6 0.6 0.6">
    </a-text>

    <a-text
        value="WARTUNG: 12 TAGE"
        position="-1.45 -0.75 0.01"
        color="#FFA500"
        scale="0.6 0.6 0.6">
    </a-text>

    <!-- Hologramm Ring -->

    <a-ring
        radius-inner="0.45"
        radius-outer="0.65"
        position="1.1 0.75 0"
        rotation="90 0 0"
        color="#00FFFF"
        animation="
        property: rotation;
        to: 90 360 0;
        loop: true;
        dur: 2500">
    </a-ring>

    <!-- Zweiter Ring -->

    <a-ring
        radius-inner="0.70"
        radius-outer="0.80"
        position="1.1 0.75 0"
        rotation="0 0 0"
        color="#00FF00"
        animation="
        property: rotation;
        to: 360 360 0;
        loop: true;
        dur: 3500">
    </a-ring>

    <!-- Status LED -->

    <a-sphere
        position="1.1 0.75 0.15"
        radius="0.12"
        color="#00FF00"
        animation="
        property: scale;
        from: 1 1 1;
        to: 1.8 1.8 1.8;
        dir: alternate;
        loop: true;
        dur: 800">
    </a-sphere>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

<script>
const overlay = document.getElementById('overlay');
const marker = document.getElementById('hiro-marker');

marker.addEventListener('markerFound', () => {
    overlay.style.display = 'block';
});

marker.addEventListener('markerLost', () => {
    overlay.style.display = 'none';
});
</script>

</body>
</html>
