<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Industrie 4.0 AR</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#overlay{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    z-index:999;
    background:#000;
    color:#00ffff;
    border:2px solid #00ffff;
    padding:10px;
    font-size:20px;
}
</style>

</head>
<body>

<div id="overlay">
MASCHINE ERKANNT
</div>

<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled: false;"
vr-mode-ui="enabled: false">

<a-marker preset="hiro" id="hiro-marker">

<!-- Hintergrund -->

<a-plane
position="0 2 0"
width="5"
height="3"
color="#000000"
opacity="0.9">
</a-plane>

<!-- Titel -->

<a-text
value="INDUSTRIE 4.0"
position="-2 3 0.1"
color="#00FFFF"
scale="1.5 1.5 1.5">
</a-text>

<!-- Daten -->

<a-text
value="STATUS: ONLINE"
position="-2 2.4 0.1"
color="#00FF00"
scale="0.8 0.8 0.8">
</a-text>

<a-text
value="TEMPERATUR: 68 C"
position="-2 1.9 0.1"
color="#FFFFFF"
scale="0.8 0.8 0.8">
</a-text>

<a-text
value="DREHZAHL: 3200 RPM"
position="-2 1.5 0.1"
color="#FFFFFF"
scale="0.8 0.8 0.8">
</a-text>

<a-text
value="LEISTUNG: 11.4 KW"
position="-2 1.1 0.1"
color="#FFFF00"
scale="0.8 0.8 0.8">
</a-text>

<a-text
value="STROM: 22 A"
position="-2 0.7 0.1"
color="#FFFFFF"
scale="0.8 0.8 0.8">
</a-text>

<a-text
value="VIBRATION: NORMAL"
position="-2 0.3 0.1"
color="#00FF00"
scale="0.8 0.8 0.8">
</a-text>

<!-- Ring -->

<a-torus
position="1.8 1.6 0.2"
radius="0.8"
radius-tubular="0.12"
color="#00FFFF"
animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
</a-torus>

<!-- LED -->

<a-sphere
position="1.8 1.6 0.4"
radius="0.15"
color="#00FF00"
animation="property: scale; from: 1 1 1; to: 2 2 2; dir: alternate; loop: true; dur: 800">
</a-sphere>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

<script>
const marker = document.getElementById('hiro-marker');
const overlay = document.getElementById('overlay');

marker.addEventListener('markerFound', () => {
    overlay.style.display = 'block';
});

marker.addEventListener('markerLost', () => {
    overlay.style.display = 'none';
});
</script>

</body>
</html>
